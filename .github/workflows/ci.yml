name: CI FOR MVP

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest # 실행환경 지정

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: authtestdb
          MYSQL_ROOT_PASSWORD: 0000
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # 실행 스텝 지정
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 시작
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: application-dev.properties 파일 주입
        run: |
          touch src/main/resources/application-dev.properties
          echo "${{ secrets.APPLICATION_DEV_PROPERTIES }}" > src/main/resources/application-dev.properties

      - name: Gradle 권한 부여
        run: chmod +x ./gradlew

      - name: Gradle 빌드 실행
        run: ./gradlew clean build --stacktrace
