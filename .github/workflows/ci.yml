name: CI FOR MVP

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: authtestdb
          MYSQL_ROOT_PASSWORD: 0000
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -p0000"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if docker exec $(docker ps -q -f ancestor=mysql:8.0) mysqladmin ping -h127.0.0.1 -uroot -p0000 --silent; then
              echo "MySQL is up!"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 10
          done

      - name: Set MySQL root password (강제 재설정 필요시)
        run: |
          docker exec $(docker ps -q -f ancestor=mysql:8.0) \
          mysql -uroot -p0000 -e "ALTER USER 'root'@'localhost' IDENTIFIED BY '0000'; FLUSH PRIVILEGES;"

      - name: Test MySQL connection
        run: |
          docker exec $(docker ps -q -f ancestor=mysql:8.0) \
          mysql -uroot -p0000 -e "SELECT 1;"

      - name: Debug MySQL env
        run: echo "MYSQL_ROOT_PASSWORD=${{ job.services.mysql.env.MYSQL_ROOT_PASSWORD }}"

      - name: MySQL container logs
        run: docker logs $(docker ps -q -f ancestor=mysql:8.0)

      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 시작
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: application-dev.properties 파일 주입
        run: |
          mkdir -p src/main/resources
          echo "${{ secrets.APPLICATION_DEV_PROPERTIES }}" > src/main/resources/application-dev.properties

      - name: Check injected application-dev.properties
        run: cat src/main/resources/application-dev.properties

      - name: Gradle 권한 부여
        run: chmod +x ./gradlew

      - name: Gradle 빌드 + 테스트
        run: ./gradlew clean build -Dspring.profiles.active=test --stacktrace
